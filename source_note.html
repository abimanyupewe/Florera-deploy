<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- proses Documentation produk -->
    <section id="proses-pembuatan" class="pt-16 pb-16 bg-gray-100">
        <div class="container mx-auto px-4">
          <h2 class="text-3xl font-semibold text-center mb-10">Documentation</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Step 1 -->
            <div
              class="relative cursor-pointer"
              onclick="showDescription('Tahap 1: Pengumpulan Bahan Alami', 'Kami memilih bahan organik terbaik yang bebas dari bahan kimia...')"
            >
              <img
                src="../../src/assets/images/pexels-sasha-kim-9413760.jpg"
                alt="Tahap 1"
                class="w-60 rounded-lg shadow-lg transition-transform duration-300 hover:scale-105"
              />
              <div
                class="w-60 rounded-lg absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-300"
              >
                <span class="text-white text-2xl">Tahap 1</span>
              </div>
            </div>
            <!-- Step 2 -->
            <div
              class="relative cursor-pointer"
              onclick="showDescription('Tahap 2: Proses Fermentasi', 'Bahan-bahan alami difermentasi dalam waktu tertentu...')"
            >
              <img
                src="../../src/assets/images/pexels-sasha-kim-9413760.jpg"
                alt="Tahap 2"
                class="w-60 rounded-lg shadow-lg transition-transform duration-300 hover:scale-105"
              />
              <div
                class="w-60 rounded-lg absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-300"
              >
                <span class="text-white text-2xl">Tahap 2</span>
              </div>
            </div>
            <!-- Step 3 -->
            <div
              class="relative cursor-pointer"
              onclick="showDescription('Tahap 3: Penyaringan dan Pengemasan', 'Pupuk yang telah jadi kemudian disaring dan dikemas...')"
            >
              <img
                src="../../src/assets/images/pexels-sasha-kim-9413760.jpg"
                alt="Tahap 3"
                class="w-60 rounded-lg shadow-lg transition-transform duration-300 hover:scale-105"
              />
              <div
                class="w-60 rounded-lg absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-300"
              >
                <span class="text-white text-2xl">Tahap 3</span>
              </div>
            </div>
          </div>
        </div>
      </section>
  
      <!-- Modal untuk Deskripsi -->
      <div
        id="overlay"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center"
      >
        <div class="bg-white p-6 rounded-lg max-w-md mx-auto shadow-lg">
          <h3 id="modal-title" class="text-xl font-semibold mb-2"></h3>
          <p id="modal-description" class="text-gray-700"></p>
          <button
            id="close"
            class="mt-4 bg-blue-500 text-white px-4 py-2 rounded"
          >
            Tutup
          </button>
        </div>
      </div>
      <!-- proses pembuatan produk end -->
</body>
</html>
