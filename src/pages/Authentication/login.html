<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="../../output.css" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-poppins h-screen flex m-0">
    <!-- Left Section with Background Image -->
    <div class="relative w-full md:w-1/12 h-[200px] md:h-full">
      <!-- Background Image -->
      <img
        src="../../assets/images/documentation/florera.png"
        alt="Florera Background"
        class="absolute inset-0 w-full h-full object-cover"
      />
      <!-- Logo -->
      <div class="absolute flex top-2 md:top-6 left-2 md:left-6">
        <img
          class="w-20 h-auto"
          src="../../assets/images/logo/logo.png"
          alt=""
        />
        <a href="#home" class="font-semibold text-lg text-white block py-6">
          FLORERA
        </a>
      </div>
      <!-- Text -->
      <div class="absolute inset-0 flex mt-24 md:mt-52">
        <h1 class="text-base md:text-3xl font-semibold text-white pr-10 md:pr-60 pl-10">
          "Jadikan
          <span class="text-green-800 bg-slate-100 px-4 rounded-lg"
            >Florera Sahabat Terbaik</span
          >
          dalam Perjalanan berkebun Anda"
        </h1>
      </div>
    </div>

    <!-- Right Section with Login Form -->
    <div
      class="flex absolute w-[100%] mt-[130px] md:mt-0 md:left-[900px] md:w-[400px] top-10 rounded-xl items-center bg-white"
    >
      <div class="bg-white rounded-xl shadow-md p-8 w-full">
        <h2 class="text-2xl font-bold text-center text-gray-700">
          Selamat datang Flokers
        </h2>
        <p class="text-sm text-center text-gray-500 mb-6">
          Masuk ke akun Florera Anda
        </p>
        <!-- Standard Login Form -->
        <form action="#" method="POST">
          <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-600"
              >Mail Address</label
            >
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Masukkan Mail Anda"
              required
              class="w-full px-4 py-2 mt-2 text-gray-700 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-800"
            />
          </div>
          <div class="mb-4">
            <label
              for="password"
              class="block text-sm font-medium text-gray-600"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password Anda"
              required
              class="w-full px-4 py-2 mt-2 text-gray-700 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-800"
            />
          </div>
          <div class="flex items-center justify-between mb-4">
            <label class="inline-flex items-center">
              <input
                type="checkbox"
                class="text-green-800 border-gray-300 rounded focus:ring-green-500"
              />
              <span class="ml-2 text-sm text-gray-600">Ingatkan aku</span>
            </label>
            <a href="#" class="text-sm text-green-800 hover:underline"
              >Lupa Password?</a
            >
          </div>
          <button
            type="submit"
            class="w-full px-4 py-2 font-semibold text-white bg-green_gw rounded-lg hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500"
          >
            Log In
          </button>
        </form>
        <p class="mt-6 text-sm text-center text-gray-500">
          Belum punya akun?
          <a href="register.html" class="text-green-800 hover:underline">Sign Up</a>
        </p>
        <div class="flex items-center my-6">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="mx-2 text-sm text-gray-500">Atau login dengan</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div>
        <!-- Google Login Button -->
        <div class="mb-6">
          <button
            type="button"
            class="flex items-center justify-center w-full px-4 py-2 text-gray-600 bg-gray-100 border rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500"
          >
            <img
              src="https://www.svgrepo.com/show/355037/google.svg"
              alt="Google Logo"
              class="w-5 h-5 mr-2"
            />
            <p>Log in dengan Google</p>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
